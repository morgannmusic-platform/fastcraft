<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - FastCraft | Morgann Music Platforms</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/navbars/accueil/navbar.css">

    <style>
        .auth-container {
            max-width: 440px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 36px 30px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-soft);
        }

        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(46, 196, 182, 0.15);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0;
            color: var(--text-soft);
            font-size: 0.8rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--line);
        }

        .auth-divider span {
            padding: 0 10px;
        }

        .btn-google {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--line);
            color: var(--text);
            gap: 10px;
            cursor: pointer;
        }

        .btn-google:hover {
            background: #f8fdfd;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.88rem;
            color: var(--text-soft);
        }

        .auth-footer a {
            color: var(--primary-dark);
            font-weight: 600;
        }

        .platform-branding {
            text-align: center;
            margin-top: 24px;
            font-size: 0.78rem;
            color: var(--text-soft);
            opacity: 0.8;
        }

        .error-message {
            color: #e63946;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>

    <main class="page-shell">
        <div class="auth-container">
            <div class="auth-header">
                <span class="eyebrow">FastCraft</span>
                <h1>Créer un compte</h1>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="displayName">Nom d'affichage</label>
                    <input type="text" id="displayName" class="form-input" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" class="form-input" placeholder="nom@exemple.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" minlength="6"
                        required>
                </div>

                <button type="submit" class="btn btn-primary full-width"
                    style="border:none; cursor:pointer;">S'inscrire</button>
            </form>

            <div class="auth-divider">
                <span>OU</span>
            </div>

            <button id="googleBtn" class="btn btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                </svg>
                S'inscrire avec Google
            </button>

            <div id="errorMessage" class="error-message"></div>

            <div class="auth-footer">
                Déjà un compte ? <a href="connexion.html">Se connecter</a>
            </div>

            <div class="platform-branding">
                Compte unifié <strong>Morgann Music Platforms</strong>
            </div>
        </div>
    </main>

    <script src="/assets/navbars/accueil/navbar.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSPUArpApBuK0Cn9VbeMtqk4JC-gqruJc",
            authDomain: "morgann-music-cp.firebaseapp.com",
            projectId: "morgann-music-cp",
            storageBucket: "morgann-music-cp.firebasestorage.app",
            messagingSenderId: "666812685196",
            appId: "1:666812685196:web:dfbd58b64eb988748494a9",
            measurementId: "G-D03LV01K0H"
        };

        const API_WORKER_URL = "https://api.fastcraft.uk"; // Remplace avec ton URL de Worker Cloudflare

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const signupForm = document.getElementById('signupForm');
        const googleBtn = document.getElementById('googleBtn');
        const errorMessage = document.getElementById('errorMessage');

        // Fonction pour synchroniser l'utilisateur dans Cloudflare D1
        async function syncUserToD1(user, displayName) {
            try {
                await fetch(`${API_WORKER_URL}/api/user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: user.uid,
                        email: user.email,
                        name: displayName || user.displayName || 'Utilisateur'
                    })
                });
            } catch (err) {
                console.error("Erreur de synchronisation D1:", err);
            }
        }

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const displayName = document.getElementById('displayName').value;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await updateProfile(user, { displayName });
                localStorage.setItem('fastcraft-user', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    displayName: displayName,
                    provider: user.providerData?.[0]?.providerId || 'password'
                }));

                // Enregistrement dans Cloudflare D1
                await syncUserToD1(user, displayName);

                window.location.href = 'account.html';
            } catch (error) {
                errorMessage.textContent = "Erreur lors de la création du compte (mot de passe trop court ou email déjà utilisé).";
                errorMessage.style.display = 'block';
            }
        });

        googleBtn.addEventListener('click', async () => {
            errorMessage.style.display = 'none';
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                localStorage.setItem('fastcraft-user', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName || 'Utilisateur',
                    provider: user.providerData?.[0]?.providerId || 'google.com'
                }));

                // Enregistrement dans Cloudflare D1
                await syncUserToD1(user, user.displayName);

                window.location.href = 'account.html';
            } catch (error) {
                errorMessage.textContent = "Impossible de créer un compte avec Google.";
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>

</html>
